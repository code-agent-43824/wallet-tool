name: Build Windows Executable

# Запускаем при пуше в любую ветку
on:
  push:
  workflow_call:
    inputs:
      artifact-name:
        required: false
        type: string
        default: windows-package

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      EXPECTED_DESCRIPTION: "Rutoken Wallet PKCS #11 library"
      PKCS11_VERSION: "3rdparty" # bump to refresh cache when library updates
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ARTIFACT_NAME: ${{ inputs.artifact-name || 'windows-package' }}

    steps:
      # 1. Забираем ваш код
      - uses: actions/checkout@v4

      # 2. Устанавливаем Python (можете указать вашу версию, например 3.12)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: 'pip'
          cache-dependency-path: 'requirements-build.txt'

      - name: Install build dependencies
        run: pip install -r requirements-build.txt

      - name: Cache pkcs11 files
        id: cache-pkcs11
        uses: actions/cache@v4
        with:
          path: |
            .cache\wtpkcs11ecp
            wtpkcs11ecp.dll
          key: pkcs11-${{ runner.os }}-${{ env.PKCS11_VERSION }}

      # Запускается и при попадании в кэш: контрольная сумма ассета проверяется
      # каждый раз, кэшированный архив доверия не заслуживает.
      - name: Fetch and verify pkcs11 dll
        shell: pwsh
        run: |
          python scripts/download_wtpkcs11ecp.py `
            --pattern windows `
            --pattern x86_64 `
            --library-pattern wtpkcs11ecp.dll

      # 3. Собираем один exe-файл
      - name: Build exe
        run: pyinstaller --onefile main.py
        
      - name: Copy DLL
        shell: pwsh
        run: Copy-Item wtpkcs11ecp.dll dist\

      - name: Test application
        shell: pwsh
        run: |
          # 1) Запускаем exe и собираем stdout+stderr
          $lines = & .\dist\main.exe --library-info 2>&1
          $text  = $lines -join "`n"

          # 2) Показываем весь вывод, чтобы было видно, что вернулось
          Write-Host "App output:`n$text"

          # 3) Проверяем, что в нём есть Library Description с ожидаемой строкой
          if ($text -notmatch "Library Description:.*$($env:EXPECTED_DESCRIPTION)") {
            Write-Error "Не удалось найти ожидаемую строку 'Library Description: $($env:EXPECTED_DESCRIPTION)' в выводе"
            exit 1
          }
          
      # 5. Загружаем получившийся exe как артефакт
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/**
